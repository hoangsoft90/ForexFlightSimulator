name: Build Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove Sentry plugin before prebuild
        run: |
          # Remove @sentry/react-native from plugins so android/ won't have sentry.gradle
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json','utf8'));
            app.expo.plugins = (app.expo.plugins||[]).filter(p => {
              const name = typeof p === 'string' ? p : p[0];
              return !name.includes('sentry');
            });
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2)+'\n');
          "

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --clean

      - name: Inject Kotlin 2.3.0 (fix play-services-ads compatibility)
        run: |
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')|g" android/build.gradle
          sed -i 's|apply plugin: "expo-root-project"|ext.kotlinVersion = "2.3.0"\napply plugin: "expo-root-project"|' android/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
