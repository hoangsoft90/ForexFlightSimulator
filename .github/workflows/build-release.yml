name: Build Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove Sentry plugin before prebuild
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json','utf8'));
            app.expo.plugins = (app.expo.plugins||[]).filter(p => {
              const name = typeof p === 'string' ? p : p[0];
              return !name.includes('sentry');
            });
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2)+'\n');
          "

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --clean

      - name: Inject Kotlin 2.3.0 (fix play-services-ads compatibility)
        run: |
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')|g" android/build.gradle
          sed -i 's|apply plugin: "expo-root-project"|ext.kotlinVersion = "2.3.0"\napply plugin: "expo-root-project"|' android/build.gradle

      - name: Decode release keystore
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > android/app/release.keystore
        env:
          RELEASE_KEYSTORE_B64: ''

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'KEYEOF'
          storePassword=forexflight123
          keyPassword=forexflight123
          keyAlias=forexflight
          storeFile=release.keystore
          KEYEOF

      - name: Inject signing config into build.gradle
        run: |
          cat > /tmp/inject-signing.js << 'JSEOF'
          const fs = require('fs');
          let gradle = fs.readFileSync('android/app/build.gradle', 'utf8');

          // Always add release signingConfig block after existing signingConfigs
          if (!gradle.includes('signingConfigs.release')) {
            gradle = gradle.replace(
              /signingConfigs\s*\{[^}]*}/,
              (match) => match + '\n        release {\n            storeFile file("release.keystore")\n            storePassword "forexflight123"\n            keyAlias "forexflight"\n            keyPassword "forexflight123"\n        }'
            );
          }

          // Add signingConfig to buildTypes.release (only if not already there)
          if (!gradle.includes('signingConfig signingConfigs.release')) {
            gradle = gradle.replace(
              /buildTypes\s*\{[\s\S]*?release\s*\{[^}]*}/,
              (match) => match.replace(/release\s*\{/, 'release {\n            signingConfig signingConfigs.release')
            );
          }

          fs.writeFileSync('android/app/build.gradle', gradle);
          console.log('Signing config injected');
          JSEOF
          node /tmp/inject-signing.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
